<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ESP32 Robot Car #4</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-bottom: 10px;
}

.status {
  margin: 15px 0;
  padding: 12px;
  background: #222;
  border-radius: 10px;
  font-size: 18px;
}

.speedBox {
  margin: 20px 0;
}

input[type="range"] {
  width: 100%;
}

.speedValue {
  font-size: 20px;
  margin-top: 8px;
}

.control {

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap: 12px;

  max-width: 350px;

  margin: 30px auto;
}

button {

  height: 80px;

  font-size: 28px;

  font-weight: bold;

  border: none;

  border-radius: 15px;

  background: #333;

  color: white;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  touch-action: none;
}

button:active {

  background: #666;

  transform: scale(0.95);
}

.forward {

  grid-column: 2;
}

.left {

  grid-column: 1;
  grid-row: 2;
}

.stop {

  grid-column: 2;
  grid-row: 2;

  background: #8b0000;
}

.right {

  grid-column: 3;
  grid-row: 2;
}

.backward {

  grid-column: 2;
  grid-row: 3;
}

.connected {
  color: #00ff66;
}

.disconnected {
  color: #ff4444;
}

.info {

  margin-top: 25px;

  color: #aaa;

  line-height: 1.7;
}

</style>

</head>

<body>

<div class="container">

<h1>ESP32 ROBOT CAR #4</h1>

<div class="status">

MQTT:

<span id="mqttStatus"
      class="disconnected">

DISCONNECTED

</span>

</div>

<div class="status">

CAR:

<span id="carStatus">

STOP

</span>

</div>

<!-- SPEED -->

<div class="speedBox">

<h3>Speed</h3>

<input
  type="range"
  id="speedSlider"
  min="0"
  max="1023"
  value="600">

<div class="speedValue">

<span id="speedValue">600</span>

</div>

</div>

<!-- CONTROL -->

<div class="control">

<button
  class="forward"
  data-command="W_ON">

W

</button>

<button
  class="left"
  data-command="A_ON">

A

</button>

<button
  class="stop"
  id="stopButton">

STOP

</button>

<button
  class="right"
  data-command="D_ON">

D

</button>

<button
  class="backward"
  data-command="S_ON">

S

</button>

</div>

<div class="info">

<b>Keyboard Control</b>

<br>

W = Forward

<br>

A = Left

<br>

S = Backward

<br>

D = Right

<br>

Release = STOP

</div>

</div>

<script>

// =====================================================
// MQTT
// =====================================================

const MQTT_BROKER =
"wss://broker.hivemq.com:8884/mqtt";

// สำคัญ: รถใหม่ใช้ car4
const MQTT_TOPIC =
"esp/car4";

const client =
mqtt.connect(MQTT_BROKER);

// =====================================================
// STATUS
// =====================================================

const mqttStatus =
document.getElementById("mqttStatus");

const carStatus =
document.getElementById("carStatus");

// =====================================================
// MQTT CONNECT
// =====================================================

client.on("connect", function() {

  console.log("MQTT CONNECTED");

  mqttStatus.textContent =
  "CONNECTED";

  mqttStatus.className =
  "connected";

});

client.on("error", function(error) {

  console.log(
    "MQTT ERROR:",
    error
  );

});

client.on("close", function() {

  mqttStatus.textContent =
  "DISCONNECTED";

  mqttStatus.className =
  "disconnected";

});

// =====================================================
// SEND COMMAND
// =====================================================

function sendCommand(command) {

  if (!client.connected) {

    console.log(
      "MQTT NOT CONNECTED"
    );

    return;
  }

  client.publish(
    MQTT_TOPIC,
    command
  );

  console.log(
    "SEND:",
    command
  );

  updateStatus(command);
}

// =====================================================
// STATUS DISPLAY
// =====================================================

function updateStatus(command) {

  if (command === "W_ON") {

    carStatus.textContent =
    "FORWARD";
  }

  else if (command === "S_ON") {

    carStatus.textContent =
    "BACKWARD";
  }

  else if (command === "A_ON") {

    carStatus.textContent =
    "LEFT";
  }

  else if (command === "D_ON") {

    carStatus.textContent =
    "RIGHT";
  }

  else if (command === "STOP") {

    carStatus.textContent =
    "STOP";
  }
}

// =====================================================
// BUTTON CONTROL
// =====================================================

const buttons =
document.querySelectorAll(
  "[data-command]"
);

buttons.forEach(function(button) {

  const command =
  button.dataset.command;

  // -------------------------
  // MOUSE
  // -------------------------

  button.addEventListener(
    "mousedown",
    function(event) {

      event.preventDefault();

      sendCommand(command);

    }
  );

  button.addEventListener(
    "mouseup",
    function(event) {

      event.preventDefault();

      sendCommand("STOP");

    }
  );

  button.addEventListener(
    "mouseleave",
    function() {

      sendCommand("STOP");

    }
  );

  // -------------------------
  // TOUCH
  // -------------------------

  button.addEventListener(
    "touchstart",
    function(event) {

      event.preventDefault();

      sendCommand(command);

    }
  );

  button.addEventListener(
    "touchend",
    function(event) {

      event.preventDefault();

      sendCommand("STOP");

    }
  );

  button.addEventListener(
    "touchcancel",
    function(event) {

      event.preventDefault();

      sendCommand("STOP");

    }
  );

});

// =====================================================
// STOP BUTTON
// =====================================================

document
.getElementById("stopButton")
.addEventListener(
  "click",
  function() {

    sendCommand("STOP");

  }
);

// =====================================================
// KEYBOARD
// =====================================================

let keyState = {};

document.addEventListener(
  "keydown",
  function(event) {

    const key =
    event.key.toLowerCase();

    if (
      key === "w" ||
      key === "a" ||
      key === "s" ||
      key === "d"
    ) {

      event.preventDefault();

      if (keyState[key]) {

        return;
      }

      keyState[key] = true;

      if (key === "w") {

        sendCommand("W_ON");

      }

      else if (key === "a") {

        sendCommand("A_ON");

      }

      else if (key === "s") {

        sendCommand("S_ON");

      }

      else if (key === "d") {

        sendCommand("D_ON");

      }

    }

  }
);

// =====================================================
// KEY RELEASE
// =====================================================

document.addEventListener(
  "keyup",
  function(event) {

    const key =
    event.key.toLowerCase();

    if (
      key === "w" ||
      key === "a" ||
      key === "s" ||
      key === "d"
    ) {

      event.preventDefault();

      keyState[key] = false;

      sendCommand("STOP");

    }

  }
);

// =====================================================
// SPEED
// =====================================================

const speedSlider =
document.getElementById(
  "speedSlider"
);

const speedDisplay =
document.getElementById(
  "speedValue"
);

speedSlider.addEventListener(
  "input",
  function() {

    const speed =
    this.value;

    speedDisplay.textContent =
    speed;

    sendCommand(
      "SPD:" + speed
    );

  }
);

// =====================================================
// SAFETY STOP
// =====================================================

window.addEventListener(
  "blur",
  function() {

    sendCommand("STOP");

  }
);

</script>

</body>

</html>
