<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ESP32 Robot Car #4</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #111;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

    touch-action: manipulation;
}


h1 {

    margin-top: 20px;

    margin-bottom: 10px;
}


/* =================================
   STATUS
================================= */

.status-box {

    width: 90%;

    max-width: 500px;

    margin: 15px auto;

    padding: 15px;

    background: #222;

    border-radius: 12px;

    font-size: 18px;
}


#mqttStatus {

    font-weight: bold;
}


#carStatus {

    margin-top: 8px;

    font-size: 22px;

    font-weight: bold;
}


/* =================================
   MODE
================================= */

.mode-box {

    width: 90%;

    max-width: 500px;

    margin: 20px auto;

    padding: 20px;

    background: #222;

    border-radius: 15px;
}


.mode-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;
}


.mode-label {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

    font-size: 17px;
}


.mode-name {

    font-weight: bold;

    font-size: 20px;
}


/* =================================
   TOGGLE
================================= */

.switch {

    position: relative;

    display: inline-block;

    width: 80px;

    height: 40px;
}


.switch input {

    opacity: 0;

    width: 0;

    height: 0;
}


.slider {

    position: absolute;

    cursor: pointer;

    inset: 0;

    background: #555;

    border-radius: 40px;

    transition: 0.25s;
}


.slider:before {

    content: "";

    position: absolute;

    height: 32px;

    width: 32px;

    left: 4px;

    top: 4px;

    background: white;

    border-radius: 50%;

    transition: 0.25s;
}


input:checked + .slider {

    background: #00aa66;
}


input:checked + .slider:before {

    transform: translateX(40px);
}


/* =================================
   SPEED
================================= */

.speed-box {

    width: 90%;

    max-width: 500px;

    margin: 20px auto;

    padding: 15px;

    background: #222;

    border-radius: 12px;
}


#speedValue {

    font-size: 22px;

    font-weight: bold;
}


input[type="range"] {

    width: 90%;
}


/* =================================
   CONTROLS
================================= */

.controls {

    width: 300px;

    margin: 25px auto;
}


.row {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin: 15px 0;
}


/* =================================
   BUTTON
================================= */

.control-btn {

    width: 85px;

    height: 85px;

    border: none;

    border-radius: 18px;

    background: #333;

    color: white;

    font-size: 32px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 0 #111,
        0 10px 15px rgba(0,0,0,0.5);

    transition:
        transform 0.06s ease,
        background 0.06s ease,
        box-shadow 0.06s ease;

    user-select: none;

    touch-action: none;
}


.control-btn.pressed {

    transform:
        translateY(7px)
        scale(0.92);

    background: #00aaff;

    box-shadow:
        0 2px 0 #006688,
        0 3px 8px rgba(0,170,255,0.8);
}


.control-btn:active {

    transform:
        translateY(7px)
        scale(0.92);

    background: #00aaff;

    box-shadow:
        0 2px 0 #006688,
        0 3px 8px rgba(0,170,255,0.8);
}


/* =================================
   STOP
================================= */

.stop-btn {

    width: 100px;

    height: 55px;

    margin-top: 10px;

    border: none;

    border-radius: 12px;

    background: #cc2222;

    color: white;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 6px 0 #661111;

    transition: all 0.06s ease;
}


.stop-btn.pressed {

    transform:
        translateY(5px)
        scale(0.94);

    background: #ff4444;

    box-shadow:
        0 1px 0 #661111;
}


/* =================================
   DISABLE MANUAL
================================= */

.manual-disabled {

    opacity: 0.35;

    pointer-events: none;
}


.info {

    margin-top: 20px;

    color: #aaa;

    font-size: 14px;
}

</style>

</head>


<body>


<h1>ESP32 ROBOT CAR #4</h1>


<!-- =================================
     STATUS
================================= -->

<div class="status-box">

    <div>

        MQTT:

        <span id="mqttStatus">
            DISCONNECTED
        </span>

    </div>


    <div id="carStatus">

        CAR: STOP

    </div>

</div>


<!-- =================================
     MODE TOGGLE
================================= -->

<div class="mode-box">

    <div class="mode-title">

        DRIVING MODE

    </div>


    <div class="mode-label">

        <span
            id="modeName"
            class="mode-name">

            MANUAL

        </span>


        <label class="switch">

            <input
                type="checkbox"
                id="modeToggle">

            <span class="slider"></span>

        </label>

    </div>


    <div id="modeDescription">

        W / A / S / D Manual Control

    </div>

</div>


<!-- =================================
     SPEED
================================= -->

<div class="speed-box">

    <div>

        SPEED:

        <span id="speedValue">
            600
        </span>

    </div>


    <br>


    <input
        type="range"
        id="speedSlider"
        min="0"
        max="1023"
        value="600">

</div>


<!-- =================================
     MANUAL CONTROL
================================= -->

<div id="manualControls"
     class="controls">


    <!-- W -->

    <div class="row">

        <button
            class="control-btn"
            id="btnW">

            W

        </button>

    </div>


    <!-- A S D -->

    <div class="row">

        <button
            class="control-btn"
            id="btnA">

            A

        </button>


        <button
            class="control-btn"
            id="btnS">

            S

        </button>


        <button
            class="control-btn"
            id="btnD">

            D

        </button>

    </div>


    <!-- STOP -->

    <button
        class="stop-btn"
        id="btnStop">

        STOP

    </button>

</div>


<div class="info">

    MANUAL:
    W = Forward |
    S = Backward |
    A = Left |
    D = Right

    <br><br>

    LINE FOLLOW:
    ESP32 controls the motors using the IR sensors.

</div>


<script>


/* =================================
   MQTT
================================= */

const MQTT_BROKER =
    "wss://broker.hivemq.com:8884/mqtt";


const MQTT_TOPIC =
    "esp/car4";


let client = null;


/* =================================
   ELEMENTS
================================= */

const mqttStatus =
    document.getElementById(
        "mqttStatus"
    );


const carStatus =
    document.getElementById(
        "carStatus"
    );


const modeToggle =
    document.getElementById(
        "modeToggle"
    );


const modeName =
    document.getElementById(
        "modeName"
    );


const modeDescription =
    document.getElementById(
        "modeDescription"
    );


const manualControls =
    document.getElementById(
        "manualControls"
    );


/* =================================
   STATUS
================================= */

function updateCarStatus(text) {

    carStatus.innerText =
        "CAR: " + text;

}


/* =================================
   MQTT CONNECT
================================= */

function connectMQTT() {

    client = mqtt.connect(
        MQTT_BROKER,
        {

            clientId:
                "WEB_CAR4_" +
                Math.random()
                    .toString(16)
                    .substring(2),

            clean: true,

            connectTimeout: 5000,

            reconnectPeriod: 3000

        }
    );


    client.on(
        "connect",
        function() {

            mqttStatus.innerText =
                "CONNECTED";

            mqttStatus.style.color =
                "#00ff66";

        }
    );


    client.on(
        "close",
        function() {

            mqttStatus.innerText =
                "DISCONNECTED";

            mqttStatus.style.color =
                "#ff4444";

        }
    );

}


/* =================================
   SEND COMMAND
================================= */

function sendCommand(command) {

    console.log(
        "SEND:",
        command
    );


    if (
        client &&
        client.connected
    ) {

        client.publish(
            MQTT_TOPIC,
            command
        );

    }

}


/* =================================
   MODE TOGGLE
================================= */

modeToggle.addEventListener(
    "change",
    function() {


        /* ============================
           LINE FOLLOW
        ============================ */

        if (this.checked) {

            // STOP FIRST

            sendCommand(
                "STOP"
            );

            setTimeout(
                function() {

                    sendCommand(
                        "MODE:LINE"
                    );

                },
                100
            );


            modeName.innerText =
                "LINE FOLLOW";


            modeName.style.color =
                "#00ff66";


            modeDescription.innerText =
                "ESP32 follows the IR sensors";


            manualControls.classList.add(
                "manual-disabled"
            );


            updateCarStatus(
                "LINE FOLLOW"
            );

        }


        /* ============================
           MANUAL
        ============================ */

        else {

            sendCommand(
                "STOP"
            );

            setTimeout(
                function() {

                    sendCommand(
                        "MODE:MANUAL"
                    );

                },
                100
            );


            modeName.innerText =
                "MANUAL";


            modeName.style.color =
                "white";


            modeDescription.innerText =
                "W / A / S / D Manual Control";


            manualControls.classList.remove(
                "manual-disabled"
            );


            updateCarStatus(
                "STOP"
            );

        }

    }
);


/* =================================
   BUTTON EFFECT
================================= */

function pressEffect(button) {

    button.classList.add(
        "pressed"
    );

}


function releaseEffect(button) {

    button.classList.remove(
        "pressed"
    );

}


/* =================================
   W
================================= */

const btnW =
    document.getElementById(
        "btnW"
    );


btnW.addEventListener(
    "mousedown",
    function(e) {

        e.preventDefault();

        pressEffect(btnW);

        sendCommand("W_ON");

        updateCarStatus(
            "FORWARD"
        );

    }
);


btnW.addEventListener(
    "mouseup",
    function() {

        releaseEffect(btnW);

        sendCommand("STOP");

        updateCarStatus(
            "STOP"
        );

    }
);


/* =================================
   A
================================= */

const btnA =
    document.getElementById(
        "btnA"
    );


btnA.addEventListener(
    "mousedown",
    function(e) {

        e.preventDefault();

        pressEffect(btnA);

        sendCommand("A_ON");

        updateCarStatus(
            "LEFT"
        );

    }
);


btnA.addEventListener(
    "mouseup",
    function() {

        releaseEffect(btnA);

        sendCommand("STOP");

        updateCarStatus(
            "STOP"
        );

    }
);


/* =================================
   S
================================= */

const btnS =
    document.getElementById(
        "btnS"
    );


btnS.addEventListener(
    "mousedown",
    function(e) {

        e.preventDefault();

        pressEffect(btnS);

        sendCommand("S_ON");

        updateCarStatus(
            "BACKWARD"
        );

    }
);


btnS.addEventListener(
    "mouseup",
    function() {

        releaseEffect(btnS);

        sendCommand("STOP");

        updateCarStatus(
            "STOP"
        );

    }
);


/* =================================
   D
================================= */

const btnD =
    document.getElementById(
        "btnD"
    );


btnD.addEventListener(
    "mousedown",
    function(e) {

        e.preventDefault();

        pressEffect(btnD);

        sendCommand("D_ON");

        updateCarStatus(
            "RIGHT"
        );

    }
);


btnD.addEventListener(
    "mouseup",
    function() {

        releaseEffect(btnD);

        sendCommand("STOP");

        updateCarStatus(
            "STOP"
        );

    }
);


/* =================================
   STOP
================================= */

const btnStop =
    document.getElementById(
        "btnStop"
    );


btnStop.addEventListener(
    "mousedown",
    function(e) {

        e.preventDefault();

        btnStop.classList.add(
            "pressed"
        );

        sendCommand(
            "STOP"
        );

        updateCarStatus(
            "STOP"
        );

    }
);


btnStop.addEventListener(
    "mouseup",
    function() {

        btnStop.classList.remove(
            "pressed"
        );

    }
);


/* =================================
   SPEED
================================= */

const speedSlider =
    document.getElementById(
        "speedSlider"
    );


const speedValue =
    document.getElementById(
        "speedValue"
    );


speedSlider.addEventListener(
    "input",
    function() {

        const speed =
            this.value;


        speedValue.innerText =
            speed;


        sendCommand(
            "SPD:" + speed
        );

    }
);


/* =================================
   KEYBOARD
================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.repeat ||
            modeToggle.checked
        ) {
            return;
        }


        const key =
            e.key.toLowerCase();


        if (key === "w") {

            pressEffect(btnW);

            sendCommand(
                "W_ON"
            );

            updateCarStatus(
                "FORWARD"
            );

        }


        else if (key === "a") {

            pressEffect(btnA);

            sendCommand(
                "A_ON"
            );

            updateCarStatus(
                "LEFT"
            );

        }


        else if (key === "s") {

            pressEffect(btnS);

            sendCommand(
                "S_ON"
            );

            updateCarStatus(
                "BACKWARD"
            );

        }


        else if (key === "d") {

            pressEffect(btnD);

            sendCommand(
                "D_ON"
            );

            updateCarStatus(
                "RIGHT"
            );

        }

    }
);


/* =================================
   KEY RELEASE
================================= */

document.addEventListener(
    "keyup",
    function(e) {

        const key =
            e.key.toLowerCase();


        if (
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d"
        ) {

            releaseEffect(btnW);
            releaseEffect(btnA);
            releaseEffect(btnS);
            releaseEffect(btnD);


            if (
                !modeToggle.checked
            ) {

                sendCommand(
                    "STOP"
                );

                updateCarStatus(
                    "STOP"
                );

            }

        }

    }
);


/* =================================
   SAFETY STOP
================================= */

window.addEventListener(
    "blur",
    function() {

        releaseEffect(btnW);
        releaseEffect(btnA);
        releaseEffect(btnS);
        releaseEffect(btnD);

        sendCommand(
            "STOP"
        );

        updateCarStatus(
            "STOP"
        );

    }
);


/* =================================
   START
================================= */

connectMQTT();

</script>

</body>

</html>
