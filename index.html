<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ESP32 CAR #4 V3</title>


<!-- ================================================= -->
<!-- MQTT.js -->
<!-- ================================================= -->

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #111;

  color: white;

  text-align: center;

  user-select: none;
}


.container {

  width: 100%;

  max-width: 700px;

  margin: auto;

  padding: 20px;
}


h1 {

  margin-bottom: 5px;
}


.subtitle {

  color: #aaa;

  margin-bottom: 20px;
}


/* ================================================= */
/* STATUS */
/* ================================================= */

.status {

  background: #222;

  border-radius: 15px;

  padding: 15px;

  margin-bottom: 15px;
}


.statusRow {

  display: flex;

  justify-content:
    space-between;

  margin: 8px 0;

  font-size: 16px;
}


.connected {

  color: #00ff66;

  font-weight: bold;
}


.disconnected {

  color: #ff4444;

  font-weight: bold;
}


/* ================================================= */
/* MODE */
/* ================================================= */

.modeBox {

  background: #222;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 15px;
}


.modeText {

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 15px;
}


/* ================================================= */
/* TOGGLE */
/* ================================================= */

.switch {

  position: relative;

  display: inline-block;

  width: 70px;

  height: 36px;
}


.switch input {

  display: none;
}


.slider {

  position: absolute;

  cursor: pointer;

  inset: 0;

  background: #555;

  border-radius: 36px;

  transition: 0.25s;
}


.slider:before {

  content: "";

  position: absolute;

  height: 28px;

  width: 28px;

  left: 4px;

  top: 4px;

  background: white;

  border-radius: 50%;

  transition: 0.25s;
}


input:checked + .slider {

  background: #00aaff;
}


input:checked + .slider:before {

  transform:
    translateX(34px);
}


/* ================================================= */
/* SPEED CONTROL */
/* ================================================= */

.speedBox {

  background: #222;

  border-radius: 15px;

  padding: 20px;

  margin-bottom: 15px;
}


.speedTitle {

  font-size: 18px;

  margin-bottom: 10px;
}


.speedValue {

  font-size: 28px;

  font-weight: bold;

  margin: 8px;
}


input[type="range"] {

  width: 100%;

  height: 8px;

  cursor: pointer;
}


/* ================================================= */
/* MOTOR SPEED GRID */
/* ================================================= */

.motorGrid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;

  margin-top: 15px;
}


.motorBox {

  background: #181818;

  border-radius: 12px;

  padding: 15px;
}


.motorTitle {

  font-size: 16px;

  margin-bottom: 8px;
}


.motorValue {

  font-size: 24px;

  font-weight: bold;

  margin-bottom: 8px;
}


/* ================================================= */
/* CONTROL */
/* ================================================= */

.controls {

  margin-top: 20px;
}


.controlGrid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;

  max-width: 400px;

  margin: auto;
}


.controlButton {

  height: 90px;

  border: none;

  border-radius: 18px;

  background: #333;

  color: white;

  font-size: 32px;

  font-weight: bold;

  cursor: pointer;

  transition:
    transform 0.08s,
    background 0.08s;
}


.controlButton:active {

  transform:
    scale(0.92);

  background:
    #00aaff;
}


.controlButton.disabled {

  opacity: 0.25;

  pointer-events: none;
}


.stopButton {

  background: #a00000;

  font-size: 24px;
}


.stopButton:active {

  background:
    #ff2222;
}


/* ================================================= */
/* HELP */
/* ================================================= */

.info {

  margin-top: 20px;

  padding: 15px;

  background: #222;

  border-radius: 15px;

  color: #aaa;

  line-height: 1.6;
}


kbd {

  background: #333;

  padding:
    3px 8px;

  border-radius: 5px;

  color: white;
}


/* ================================================= */
/* RESPONSIVE */
/* ================================================= */

@media (
  max-width: 500px
) {

  .controlButton {

    height: 75px;

    font-size: 26px;
  }

  .motorGrid {

    grid-template-columns:
      1fr;
  }
}

</style>

</head>


<body>


<div class="container">


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<h1>
  ESP32 CAR #4
</h1>

<div class="subtitle">
  Following Line Patrol Car — V3
</div>


<!-- ================================================= -->
<!-- STATUS -->
<!-- ================================================= -->

<div class="status">

  <div class="statusRow">

    <span>
      MQTT
    </span>

    <span
      id="mqttStatus"
      class="disconnected"
    >
      DISCONNECTED
    </span>

  </div>


  <div class="statusRow">

    <span>
      CAR
    </span>

    <span id="carStatus">
      STOP
    </span>

  </div>


  <div class="statusRow">

    <span>
      MODE
    </span>

    <span id="modeStatus">
      MANUAL
    </span>

  </div>

</div>


<!-- ================================================= -->
<!-- MODE -->
<!-- ================================================= -->

<div class="modeBox">

  <div
    id="modeText"
    class="modeText"
  >
    MANUAL
  </div>


  <label class="switch">

    <input
      type="checkbox"
      id="modeToggle"
    >

    <span class="slider"></span>

  </label>


  <div style="margin-top:10px;color:#aaa">

    OFF = MANUAL

    <br>

    ON = LINE FOLLOW

  </div>

</div>


<!-- ================================================= -->
<!-- MASTER SPEED -->
<!-- ================================================= -->

<div class="speedBox">

  <div class="speedTitle">
    MASTER SPEED
  </div>


  <div
    id="masterSpeedValue"
    class="speedValue"
  >
    600
  </div>


  <input
    type="range"
    id="masterSpeed"
    min="0"
    max="1023"
    value="600"
  >


  <div class="motorGrid">


    <!-- LEFT -->

    <div class="motorBox">

      <div class="motorTitle">
        LEFT MOTOR
      </div>

      <div
        id="leftSpeedValue"
        class="motorValue"
      >
        600
      </div>

      <input
        type="range"
        id="leftSpeed"
        min="0"
        max="1023"
        value="600"
      >

    </div>


    <!-- RIGHT -->

    <div class="motorBox">

      <div class="motorTitle">
        RIGHT MOTOR
      </div>

      <div
        id="rightSpeedValue"
        class="motorValue"
      >
        600
      </div>

      <input
        type="range"
        id="rightSpeed"
        min="0"
        max="1023"
        value="600"
      >

    </div>

  </div>

</div>


<!-- ================================================= -->
<!-- CONTROL -->
<!-- ================================================= -->

<div class="controls">


  <div class="controlGrid">


    <!-- EMPTY -->

    <div></div>


    <!-- W -->

    <button
      class="controlButton manualControl"
      id="btnW"
    >
      W
    </button>


    <!-- EMPTY -->

    <div></div>


    <!-- A -->

    <button
      class="controlButton manualControl"
      id="btnA"
    >
      A
    </button>


    <!-- STOP -->

    <button
      class="controlButton stopButton"
      id="btnSTOP"
    >
      STOP
    </button>


    <!-- D -->

    <button
      class="controlButton manualControl"
      id="btnD"
    >
      D
    </button>


    <!-- EMPTY -->

    <div></div>


    <!-- S -->

    <button
      class="controlButton manualControl"
      id="btnS"
    >
      S
    </button>


    <!-- EMPTY -->

    <div></div>

  </div>

</div>


<!-- ================================================= -->
<!-- INFO -->
<!-- ================================================= -->

<div class="info">

  Manual control:

  <br>

  <kbd>W</kbd>
  Forward

  <br>

  <kbd>S</kbd>
  Backward

  <br>

  <kbd>A</kbd>
  Tank Turn Left

  <br>

  <kbd>D</kbd>
  Tank Turn Right

  <br><br>

  Both motor speeds can be calibrated
  independently.

</div>


</div>


<script>


// =====================================================
// MQTT CONFIG
// =====================================================

const MQTT_BROKER =
  "wss://broker.hivemq.com:8884/mqtt";


const MQTT_TOPIC =
  "esp/car4";


// =====================================================
// MQTT CLIENT
// =====================================================

let client = null;


// =====================================================
// STATE
// =====================================================

let connected = false;

let lineMode = false;

let currentCommand = "STOP";


// =====================================================
// ELEMENTS
// =====================================================

const mqttStatus =
  document.getElementById(
    "mqttStatus"
  );


const carStatus =
  document.getElementById(
    "carStatus"
  );


const modeStatus =
  document.getElementById(
    "modeStatus"
  );


const modeText =
  document.getElementById(
    "modeText"
  );


const modeToggle =
  document.getElementById(
    "modeToggle"
  );


const masterSpeed =
  document.getElementById(
    "masterSpeed"
  );


const masterSpeedValue =
  document.getElementById(
    "masterSpeedValue"
  );


const leftSpeed =
  document.getElementById(
    "leftSpeed"
  );


const rightSpeed =
  document.getElementById(
    "rightSpeed"
  );


const leftSpeedValue =
  document.getElementById(
    "leftSpeedValue"
  );


const rightSpeedValue =
  document.getElementById(
    "rightSpeedValue"
  );


// =====================================================
// MQTT CONNECT
// =====================================================

function connectMQTT() {

  mqttStatus.innerText =
    "CONNECTING...";

  mqttStatus.className =
    "disconnected";


  client =
    mqtt.connect(
      MQTT_BROKER,
      {

        clientId:
          "WEB_CAR4_" +
          Math.random()
            .toString(16)
            .substring(2),

        clean: true,

        reconnectPeriod: 2000

      }
    );


  // ===================================================
  // CONNECTED
  // ===================================================

  client.on(
    "connect",
    function() {

      connected = true;


      mqttStatus.innerText =
        "CONNECTED";

      mqttStatus.className =
        "connected";


      console.log(
        "MQTT CONNECTED"
      );

    }
  );


  // ===================================================
  // DISCONNECT
  // ===================================================

  client.on(
    "close",
    function() {

      connected = false;


      mqttStatus.innerText =
        "DISCONNECTED";

      mqttStatus.className =
        "disconnected";

    }
  );


  // ===================================================
  // ERROR
  // ===================================================

  client.on(
    "error",
    function(error) {

      console.log(
        "MQTT ERROR",
        error
      );

    }
  );

}


// =====================================================
// SEND MQTT
// =====================================================

function sendCommand(
  command
) {

  if (
    !connected
  ) {

    return;
  }


  client.publish(
    MQTT_TOPIC,
    command
  );


  console.log(
    "SEND:",
    command
  );
}


// =====================================================
// CAR STATUS
// =====================================================

function setCarStatus(
  status
) {

  currentCommand =
    status;


  carStatus.innerText =
    status;
}


// =====================================================
// MODE UPDATE
// =====================================================

function updateModeUI() {

  if (
    lineMode
  ) {

    modeText.innerText =
      "LINE FOLLOW";

    modeStatus.innerText =
      "LINE FOLLOW";

  }

  else {

    modeText.innerText =
      "MANUAL";

    modeStatus.innerText =
      "MANUAL";
  }


  // Disable manual controls
  // in line follow mode

  document
    .querySelectorAll(
      ".manualControl"
    )
    .forEach(
      function(button) {

        if (
          lineMode
        ) {

          button.classList.add(
            "disabled"
          );

        }

        else {

          button.classList.remove(
            "disabled"
          );
        }

      }
    );
}


// =====================================================
// MODE TOGGLE
// =====================================================

modeToggle.addEventListener(
  "change",
  function() {


    // ================================================
    // LINE FOLLOW
    // ================================================

    if (
      modeToggle.checked
    ) {

      lineMode = true;


      sendCommand(
        "STOP"
      );


      setCarStatus(
        "STOP"
      );


      sendCommand(
        "MODE:LINE"
      );


      updateModeUI();

    }


    // ================================================
    // MANUAL
    // ================================================

    else {

      lineMode = false;


      sendCommand(
        "STOP"
      );


      setCarStatus(
        "STOP"
      );


      sendCommand(
        "MODE:MANUAL"
      );


      updateModeUI();

    }

  }
);


// =====================================================
// MASTER SPEED
// =====================================================

masterSpeed.addEventListener(
  "input",
  function() {

    const value =
      Number(
        masterSpeed.value
      );


    masterSpeedValue.innerText =
      value;


    // Set both motors

    leftSpeed.value =
      value;

    rightSpeed.value =
      value;


    leftSpeedValue.innerText =
      value;

    rightSpeedValue.innerText =
      value;


    sendCommand(
      "SPD:" + value
    );

  }
);


// =====================================================
// LEFT SPEED
// =====================================================

leftSpeed.addEventListener(
  "input",
  function() {

    const value =
      Number(
        leftSpeed.value
      );


    leftSpeedValue.innerText =
      value;


    sendCommand(
      "LSPD:" + value
    );

  }
);


// =====================================================
// RIGHT SPEED
// =====================================================

rightSpeed.addEventListener(
  "input",
  function() {

    const value =
      Number(
        rightSpeed.value
      );


    rightSpeedValue.innerText =
      value;


    sendCommand(
      "RSPD:" + value
    );

  }
);


// =====================================================
// BUTTON PRESS
// =====================================================

function pressCommand(
  command
) {

  if (
    lineMode
  ) {

    return;
  }


  sendCommand(
    command
  );


  if (
    command ===
    "W_ON"
  ) {

    setCarStatus(
      "FORWARD"
    );

  }

  else if (
    command ===
    "S_ON"
  ) {

    setCarStatus(
      "BACKWARD"
    );

  }

  else if (
    command ===
    "A_ON"
  ) {

    setCarStatus(
      "LEFT"
    );

  }

  else if (
    command ===
    "D_ON"
  ) {

    setCarStatus(
      "RIGHT"
    );
  }
}


// =====================================================
// RELEASE
// =====================================================

function releaseCommand() {

  if (
    lineMode
  ) {

    return;
  }


  sendCommand(
    "STOP"
  );


  setCarStatus(
    "STOP"
  );
}


// =====================================================
// BUTTON SETUP
// =====================================================

function setupButton(
  id,
  command
) {

  const button =
    document.getElementById(
      id
    );


  // Mouse

  button.addEventListener(
    "mousedown",
    function(event) {

      event.preventDefault();

      pressCommand(
        command
      );

    }
  );


  button.addEventListener(
    "mouseup",
    function(event) {

      event.preventDefault();

      releaseCommand();

    }
  );


  button.addEventListener(
    "mouseleave",
    function() {

      releaseCommand();

    }
  );


  // Touch

  button.addEventListener(
    "touchstart",
    function(event) {

      event.preventDefault();

      pressCommand(
        command
      );

    },
    {
      passive: false
    }
  );


  button.addEventListener(
    "touchend",
    function(event) {

      event.preventDefault();

      releaseCommand();

    },
    {
      passive: false
    }
  );

}


// =====================================================
// BUTTONS
// =====================================================

setupButton(
  "btnW",
  "W_ON"
);


setupButton(
  "btnA",
  "A_ON"
);


setupButton(
  "btnS",
  "S_ON"
);


setupButton(
  "btnD",
  "D_ON"
);


// =====================================================
// STOP BUTTON
// =====================================================

document
  .getElementById(
    "btnSTOP"
  )
  .addEventListener(
    "click",
    function() {

      sendCommand(
        "STOP"
      );


      setCarStatus(
        "STOP"
      );

    }
  );


// =====================================================
// KEYBOARD
// =====================================================

let keyboardPressed =
  false;


document.addEventListener(
  "keydown",
  function(event) {

    if (
      lineMode
    ) {

      return;
    }


    if (
      keyboardPressed
    ) {

      return;
    }


    const key =
      event.key.toLowerCase();


    let command =
      null;


    if (
      key === "w"
    ) {

      command =
        "W_ON";

    }

    else if (
      key === "a"
    ) {

      command =
        "A_ON";

    }

    else if (
      key === "s"
    ) {

      command =
        "S_ON";

    }

    else if (
      key === "d"
    ) {

      command =
        "D_ON";
    }


    if (
      command
    ) {

      event.preventDefault();


      keyboardPressed =
        true;


      pressCommand(
        command
      );
    }

  }
);


// =====================================================
// KEYBOARD RELEASE
// =====================================================

document.addEventListener(
  "keyup",
  function(event) {

    const key =
      event.key.toLowerCase();


    if (
      key === "w" ||
      key === "a" ||
      key === "s" ||
      key === "d"
    ) {

      keyboardPressed =
        false;


      releaseCommand();

    }

  }
);


// =====================================================
// SAFETY STOP
// =====================================================

window.addEventListener(
  "blur",
  function() {

    if (
      !lineMode
    ) {

      sendCommand(
        "STOP"
      );


      setCarStatus(
        "STOP"
      );
    }

  }
);


// =====================================================
// INITIAL UI
// =====================================================

updateModeUI();


// =====================================================
// CONNECT
// =====================================================

connectMQTT();

</script>

</body>

</html>
