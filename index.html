
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ESP32 Robot Car #4</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

/* =====================================================
   PAGE
   ===================================================== */

body {

  margin: 0;
  padding: 0;

  font-family: Arial, sans-serif;

  background: #111;

  color: white;

  text-align: center;
}

.container {

  max-width: 500px;

  margin: auto;

  padding: 20px;
}

h1 {

  margin-bottom: 10px;
}

/* =====================================================
   STATUS
   ===================================================== */

.status {

  margin: 15px 0;

  padding: 12px;

  background: #222;

  border-radius: 10px;

  font-size: 18px;
}

.connected {

  color: #00ff66;
}

.disconnected {

  color: #ff4444;
}

/* =====================================================
   SPEED
   ===================================================== */

.speedBox {

  margin: 20px 0;
}

input[type="range"] {

  width: 100%;

  cursor: pointer;
}

.speedValue {

  font-size: 20px;

  margin-top: 8px;
}

/* =====================================================
   CONTROL
   ===================================================== */

.control {

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap: 12px;

  max-width: 350px;

  margin: 30px auto;
}

/* =====================================================
   BUTTON
   ===================================================== */

button {

  height: 80px;

  font-size: 28px;

  font-weight: bold;

  border: none;

  border-radius: 15px;

  background: #333;

  color: white;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  touch-action: none;

  /* Smooth animation */

  transition:

    transform 0.08s ease,

    background 0.08s ease,

    box-shadow 0.08s ease;
}

/* =====================================================
   BUTTON HOVER
   ===================================================== */

button:hover {

  background: #444;

}

/* =====================================================
   BUTTON PRESSED
   ===================================================== */

button.pressed {

  transform:

    scale(0.92)

    translateY(4px);

  background: #666;

  box-shadow:

    0 2px 0 #000,

    inset 0 3px 8px rgba(0,0,0,0.6);

}

/* =====================================================
   STOP BUTTON
   ===================================================== */

.stop {

  background: #8b0000;

}

.stop:hover {

  background: #a00000;

}

.stop.pressed {

  background: #ff2020;

  transform:

    scale(0.92)

    translateY(4px);

}

/* =====================================================
   ACTIVE MOVEMENT
   ===================================================== */

button.active {

  background: #555;

  box-shadow:

    0 0 15px rgba(255,255,255,0.25);

}

/* =====================================================
   INFO
   ===================================================== */

.info {

  margin-top: 25px;

  color: #aaa;

  line-height: 1.7;
}

</style>

</head>

<body>

<div class="container">

<h1>ESP32 ROBOT CAR #4</h1>

<div class="status">

MQTT:

<span id="mqttStatus"
      class="disconnected">

DISCONNECTED

</span>

</div>

<div class="status">

CAR:

<span id="carStatus">

STOP

</span>

</div>

<!-- =================================================
     SPEED
     ================================================= -->

<div class="speedBox">

<h3>Speed</h3>

<input
  type="range"
  id="speedSlider"
  min="0"
  max="1023"
  value="600">

<div class="speedValue">

<span id="speedValue">600</span>

</div>

</div>

<!-- =================================================
     CONTROL
     ================================================= -->

<div class="control">

<button
  class="forward"
  data-command="W_ON"
  data-key="w">

W

</button>

<button
  class="left"
  data-command="A_ON"
  data-key="a">

A

</button>

<button
  class="stop"
  id="stopButton">

STOP

</button>

<button
  class="right"
  data-command="D_ON"
  data-key="d">

D

</button>

<button
  class="backward"
  data-command="S_ON"
  data-key="s">

S

</button>

</div>

<div class="info">

<b>Keyboard Control</b>

<br>

W = Forward

<br>

A = Left

<br>

S = Backward

<br>

D = Right

<br>

Release = STOP

</div>

</div>

<script>

/* =====================================================
   MQTT
   ===================================================== */

const MQTT_BROKER =
"wss://broker.hivemq.com:8884/mqtt";

const MQTT_TOPIC =
"esp/car4";

const client =
mqtt.connect(MQTT_BROKER);

/* =====================================================
   ELEMENTS
   ===================================================== */

const mqttStatus =
document.getElementById(
  "mqttStatus"
);

const carStatus =
document.getElementById(
  "carStatus"
);

const buttons =
document.querySelectorAll(
  "[data-command]"
);

/* =====================================================
   MQTT CONNECT
   ===================================================== */

client.on("connect", function() {

  console.log(
    "MQTT CONNECTED"
  );

  mqttStatus.textContent =
  "CONNECTED";

  mqttStatus.className =
  "connected";

});

client.on("error", function(error) {

  console.log(
    "MQTT ERROR:",
    error
  );

});

client.on("close", function() {

  mqttStatus.textContent =
  "DISCONNECTED";

  mqttStatus.className =
  "disconnected";

});

/* =====================================================
   SEND COMMAND
   ===================================================== */

function sendCommand(command) {

  if (!client.connected) {

    console.log(
      "MQTT NOT CONNECTED"
    );

    return;
  }

  client.publish(
    MQTT_TOPIC,
    command
  );

  console.log(
    "SEND:",
    command
  );

  updateStatus(command);
}

/* =====================================================
   CAR STATUS
   ===================================================== */

function updateStatus(command) {

  if (command === "W_ON") {

    carStatus.textContent =
    "FORWARD";
  }

  else if (command === "S_ON") {

    carStatus.textContent =
    "BACKWARD";
  }

  else if (command === "A_ON") {

    carStatus.textContent =
    "LEFT";
  }

  else if (command === "D_ON") {

    carStatus.textContent =
    "RIGHT";
  }

  else if (command === "STOP") {

    carStatus.textContent =
    "STOP";
  }
}

/* =====================================================
   BUTTON PRESS EFFECT
   ===================================================== */

function pressButton(button) {

  button.classList.add(
    "pressed"
  );

  button.classList.add(
    "active"
  );
}

/* =====================================================
   BUTTON RELEASE EFFECT
   ===================================================== */

function releaseButton(button) {

  button.classList.remove(
    "pressed"
  );

  button.classList.remove(
    "active"
  );
}

/* =====================================================
   MOUSE CONTROL
   ===================================================== */

buttons.forEach(function(button) {

  const command =
  button.dataset.command;

  button.addEventListener(
    "mousedown",
    function(event) {

      event.preventDefault();

      pressButton(button);

      sendCommand(command);

    }
  );

  button.addEventListener(
    "mouseup",
    function(event) {

      event.preventDefault();

      releaseButton(button);

      sendCommand("STOP");

    }
  );

  button.addEventListener(
    "mouseleave",
    function() {

      releaseButton(button);

      sendCommand("STOP");

    }
  );

  /* =================================================
     TOUCH CONTROL
     ================================================= */

  button.addEventListener(
    "touchstart",
    function(event) {

      event.preventDefault();

      pressButton(button);

      sendCommand(command);

    }
  );

  button.addEventListener(
    "touchend",
    function(event) {

      event.preventDefault();

      releaseButton(button);

      sendCommand("STOP");

    }
  );

  button.addEventListener(
    "touchcancel",
    function(event) {

      event.preventDefault();

      releaseButton(button);

      sendCommand("STOP");

    }
  );

});

/* =====================================================
   STOP BUTTON
   ===================================================== */

const stopButton =
document.getElementById(
  "stopButton"
);

stopButton.addEventListener(
  "mousedown",
  function() {

    pressButton(
      stopButton
    );

    sendCommand("STOP");

  }
);

stopButton.addEventListener(
  "mouseup",
  function() {

    releaseButton(
      stopButton
    );

  }
);

stopButton.addEventListener(
  "touchstart",
  function(event) {

    event.preventDefault();

    pressButton(
      stopButton
    );

    sendCommand("STOP");

  }
);

stopButton.addEventListener(
  "touchend",
  function(event) {

    event.preventDefault();

    releaseButton(
      stopButton
    );

  }
);

/* =====================================================
   KEYBOARD
   ===================================================== */

let keyState = {};

document.addEventListener(
  "keydown",
  function(event) {

    const key =
    event.key.toLowerCase();

    if (
      key !== "w" &&
      key !== "a" &&
      key !== "s" &&
      key !== "d"
    ) {

      return;
    }

    event.preventDefault();

    if (keyState[key]) {

      return;
    }

    keyState[key] = true;

    const button =
    document.querySelector(
      '[data-key="' + key + '"]'
    );

    if (button) {

      pressButton(button);

    }

    if (key === "w") {

      sendCommand("W_ON");

    }

    else if (key === "a") {

      sendCommand("A_ON");

    }

    else if (key === "s") {

      sendCommand("S_ON");

    }

    else if (key === "d") {

      sendCommand("D_ON");

    }

  }
);

/* =====================================================
   KEY RELEASE
   ===================================================== */

document.addEventListener(
  "keyup",
  function(event) {

    const key =
    event.key.toLowerCase();

    if (
      key !== "w" &&
      key !== "a" &&
      key !== "s" &&
      key !== "d"
    ) {

      return;
    }

    event.preventDefault();

    keyState[key] = false;

    const button =
    document.querySelector(
      '[data-key="' + key + '"]'
    );

    if (button) {

      releaseButton(button);

    }

    sendCommand("STOP");

  }
);

/* =====================================================
   SPEED SLIDER
   ===================================================== */

const speedSlider =
document.getElementById(
  "speedSlider"
);

const speedDisplay =
document.getElementById(
  "speedValue"
);

speedSlider.addEventListener(
  "input",
  function() {

    const speed =
    this.value;

    speedDisplay.textContent =
    speed;

    sendCommand(
      "SPD:" + speed
    );

  }
);

/* =====================================================
   SAFETY STOP
   ===================================================== */

window.addEventListener(
  "blur",
  function() {

    sendCommand("STOP");

    buttons.forEach(
      function(button) {

        releaseButton(button);

      }
    );

  }
);

</script>

</body>

</html>
