<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ESP32 Patrol Car V3.1</title>


<!-- =================================================
     MQTT.JS
================================================== -->

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #111;

  color:
    white;

  text-align:
    center;
}


.container {

  max-width:
    600px;

  margin:
    auto;

  padding:
    20px;
}


h1 {

  margin-top:
    10px;

  font-size:
    28px;
}


.subtitle {

  color:
    #aaa;

  margin-bottom:
    20px;
}


/* =================================================
   MQTT STATUS
================================================= */

.status {

  padding:
    12px;

  border-radius:
    10px;

  background:
    #222;

  margin-bottom:
    20px;

  font-weight:
    bold;
}


.connected {

  color:
    #00ff88;
}


.disconnected {

  color:
    #ff4444;
}


/* =================================================
   MODE SWITCH
================================================= */

.mode-box {

  background:
    #222;

  border-radius:
    15px;

  padding:
    15px;

  margin-bottom:
    20px;
}


.mode-title {

  font-size:
    18px;

  margin-bottom:
    12px;
}


.mode-buttons {

  display:
    flex;

  gap:
    10px;
}


.mode-button {

  flex:
    1;

  border:
    none;

  padding:
    15px;

  border-radius:
    10px;

  font-size:
    16px;

  font-weight:
    bold;

  cursor:
    pointer;

  background:
    #333;

  color:
    white;
}


.mode-button.active {

  background:
    #008cff;
}


/* =================================================
   CONTROL AREA
================================================= */

.control {

  background:
    #222;

  border-radius:
    20px;

  padding:
    20px;

  margin-top:
    20px;
}


.control-grid {

  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap:
    12px;

  max-width:
    360px;

  margin:
    auto;
}


.control-button {

  height:
    90px;

  border:
    none;

  border-radius:
    18px;

  background:
    #333;

  color:
    white;

  font-size:
    30px;

  font-weight:
    bold;

  cursor:
    pointer;

  user-select:
    none;

  -webkit-user-select:
    none;

  touch-action:
    none;

  transition:
    0.08s;
}


.control-button:active {

  transform:
    scale(0.94);

  background:
    #008cff;
}


.empty {

  visibility:
    hidden;
}


/* =================================================
   STOP
================================================= */

.stop-button {

  width:
    100%;

  max-width:
    360px;

  margin:
    20px auto 0;

  display:
    block;

  height:
    70px;

  border:
    none;

  border-radius:
    15px;

  background:
    #d22;

  color:
    white;

  font-size:
    24px;

  font-weight:
    bold;

  cursor:
    pointer;

  touch-action:
    manipulation;
}


.stop-button:active {

  transform:
    scale(0.96);

  background:
    #ff4444;
}


/* =================================================
   CURRENT COMMAND
================================================= */

.current {

  margin-top:
    20px;

  background:
    #222;

  padding:
    15px;

  border-radius:
    12px;

  font-size:
    18px;
}


/* =================================================
   INFO
================================================= */

.info {

  margin-top:
    20px;

  color:
    #888;

  font-size:
    13px;

  line-height:
    1.6;
}

</style>

</head>


<body>


<div class="container">


<h1>
ESP32 Patrol Car
</h1>


<div class="subtitle">
V3.1 Tank Turn Control
</div>


<!-- =================================================
     MQTT STATUS
================================================= -->

<div
  id="mqttStatus"
  class="status disconnected"
>

MQTT: DISCONNECTED

</div>


<!-- =================================================
     MODE
================================================= -->

<div class="mode-box">

<div class="mode-title">
Driving Mode
</div>


<div class="mode-buttons">

<button
  id="manualBtn"
  class="mode-button active"
  onclick="setManualMode()"
>
MANUAL
</button>


<button
  id="lineBtn"
  class="mode-button"
  onclick="setLineMode()"
>
LINE FOLLOW
</button>

</div>

</div>


<!-- =================================================
     CONTROL
================================================= -->

<div class="control">


<div class="control-grid">


<!-- EMPTY -->

<div class="empty"></div>


<!-- W -->

<button
  class="control-button"
  id="btnW"
>
W
</button>


<!-- EMPTY -->

<div class="empty"></div>


<!-- A -->

<button
  class="control-button"
  id="btnA"
>
A
</button>


<!-- S -->

<button
  class="control-button"
  id="btnS"
>
S
</button>


<!-- D -->

<button
  class="control-button"
  id="btnD"
>
D
</button>


</div>


<!-- STOP -->

<button
  class="stop-button"
  id="stopBtn"
>
STOP
</button>


</div>


<!-- =================================================
     CURRENT COMMAND
================================================= -->

<div class="current">

Command:
<span id="commandText">
STOP
</span>

</div>


<!-- =================================================
     INFO
================================================= -->

<div class="info">

W = Forward<br>

S = Backward<br>

A = Tank Left<br>

D = Tank Right<br>

Release key/button = STOP<br>

Line mode uses Tank Turning

</div>


</div>


<script>


// =====================================================
// MQTT
// =====================================================

const MQTT_URL =
  "wss://broker.hivemq.com:8884/mqtt";


const MQTT_TOPIC =
  "esp/car4";


let client;


// =====================================================
// MODE
// =====================================================

let currentMode =
  "MANUAL";


// =====================================================
// MQTT CONNECT
// =====================================================

function connectMQTT() {

  document.getElementById(
    "mqttStatus"
  ).innerText =
    "MQTT: CONNECTING...";


  document.getElementById(
    "mqttStatus"
  ).className =
    "status";


  client =
    mqtt.connect(
      MQTT_URL,
      {

        clientId:
          "HTML_CAR4_" +
          Math.random()
            .toString(16)
            .substring(2),

        clean:
          true,

        reconnectPeriod:
          2000

      }
    );


  // =================================================
  // CONNECTED
  // =================================================

  client.on(
    "connect",
    function() {

      console.log(
        "MQTT CONNECTED"
      );


      document.getElementById(
        "mqttStatus"
      ).innerText =
        "MQTT: CONNECTED";


      document.getElementById(
        "mqttStatus"
      ).className =
        "status connected";


      sendMQTT(
        "MODE:MANUAL"
      );

    }
  );


  // =================================================
  // DISCONNECTED
  // =================================================

  client.on(
    "close",
    function() {

      document.getElementById(
        "mqttStatus"
      ).innerText =
        "MQTT: DISCONNECTED";


      document.getElementById(
        "mqttStatus"
      ).className =
        "status disconnected";

    }
  );


  // =================================================
  // ERROR
  // =================================================

  client.on(
    "error",
    function(error) {

      console.log(
        "MQTT ERROR",
        error
      );

    }
  );

}


// =====================================================
// SEND MQTT
// =====================================================

function sendMQTT(
  message
) {

  if (
    !client ||
    !client.connected
  ) {

    return;
  }


  client.publish(
    MQTT_TOPIC,
    message
  );


  console.log(
    "SEND:",
    message
  );
}


// =====================================================
// COMMAND DISPLAY
// =====================================================

function showCommand(
  text
) {

  document.getElementById(
    "commandText"
  ).innerText =
    text;
}


// =====================================================
// MANUAL MODE
// =====================================================

function setManualMode() {

  currentMode =
    "MANUAL";


  sendMQTT(
    "MODE:MANUAL"
  );


  document.getElementById(
    "manualBtn"
  ).classList.add(
    "active"
  );


  document.getElementById(
    "lineBtn"
  ).classList.remove(
    "active"
  );


  sendMQTT(
    "STOP"
  );


  showCommand(
    "MANUAL"
  );

}


// =====================================================
// LINE MODE
// =====================================================

function setLineMode() {

  currentMode =
    "LINE";


  sendMQTT(
    "MODE:LINE"
  );


  document.getElementById(
    "lineBtn"
  ).classList.add(
    "active"
  );


  document.getElementById(
    "manualBtn"
  ).classList.remove(
    "active"
  );


  showCommand(
    "LINE FOLLOW"
  );

}


// =====================================================
// STOP
// =====================================================

function stopCar() {

  sendMQTT(
    "STOP"
  );


  showCommand(
    "STOP"
  );

}


// =====================================================
// MANUAL COMMAND
// =====================================================

function command(
  cmd
) {

  if (
    currentMode !==
    "MANUAL"
  ) {

    return;
  }


  sendMQTT(
    cmd + "_ON"
  );


  showCommand(
    cmd
  );

}


// =====================================================
// BUTTON CONTROL
// =====================================================

function setupButton(
  id,
  cmd
) {

  const button =
    document.getElementById(
      id
    );


  // =================================================
  // MOUSE
  // =================================================

  button.addEventListener(
    "mousedown",
    function(event) {

      event.preventDefault();

      command(cmd);

    }
  );


  button.addEventListener(
    "mouseup",
    function(event) {

      event.preventDefault();

      stopCar();

    }
  );


  button.addEventListener(
    "mouseleave",
    function() {

      stopCar();

    }
  );


  // =================================================
  // TOUCH
  // =================================================

  button.addEventListener(
    "touchstart",
    function(event) {

      event.preventDefault();

      command(cmd);

    },
    {
      passive: false
    }
  );


  button.addEventListener(
    "touchend",
    function(event) {

      event.preventDefault();

      stopCar();

    },
    {
      passive: false
    }
  );


  button.addEventListener(
    "touchcancel",
    function(event) {

      event.preventDefault();

      stopCar();

    },
    {
      passive: false
    }
  );

}


// =====================================================
// SET BUTTONS
// =====================================================

setupButton(
  "btnW",
  "W"
);


setupButton(
  "btnA",
  "A"
);


setupButton(
  "btnS",
  "S"
);


setupButton(
  "btnD",
  "D"
);


// =====================================================
// STOP BUTTON
// =====================================================

document
  .getElementById(
    "stopBtn"
  )
  .addEventListener(
    "click",
    function() {

      stopCar();

    }
  );


// =====================================================
// KEYBOARD
// =====================================================

let keyPressed =
  null;


document.addEventListener(
  "keydown",
  function(event) {

    if (
      currentMode !==
      "MANUAL"
    ) {

      return;
    }


    if (
      event.repeat
    ) {

      return;
    }


    let key =
      event.key.toUpperCase();


    if (
      key === "W" ||
      key === "A" ||
      key === "S" ||
      key === "D"
    ) {

      keyPressed =
        key;


      command(
        key
      );

    }

  }
);


// =====================================================
// KEYBOARD RELEASE
// =====================================================

document.addEventListener(
  "keyup",
  function(event) {

    let key =
      event.key.toUpperCase();


    if (
      key === keyPressed
    ) {

      keyPressed =
        null;


      stopCar();

    }

  }
);


// =====================================================
// SPACE = STOP
// =====================================================

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      stopCar();

    }

  }
);


// =====================================================
// CONNECT
// =====================================================

connectMQTT();

</script>


</body>

</html>
